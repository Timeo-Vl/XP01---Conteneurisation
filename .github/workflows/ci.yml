name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Construire l'image Docker
        run: docker build -t blackjack:ci .

      - name: Vérifier que le conteneur démarre
        run: |
          docker run -d -p 3000:3000 --name blackjack-ci blackjack:ci
          sleep 3
          curl --fail http://localhost:3000/score